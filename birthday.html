
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Birthday Celebrants</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #111827, #202c49, #38254c);
}

header {
    text-align: center;
    padding: 35px 15px 25px;
}

header h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 46px);
    color: #ffda83;
}

header p {
    color: #cbd5e1;
    margin: 10px 0;
}

#today {
    font-size: 17px;
    color: #fff;
    margin-top: 15px;
}

#count {
    display: inline-block;
    margin-top: 12px;
    padding: 7px 18px;
    border-radius: 30px;
    background: #ffffff18;
    color: #ffda83;
    font-size: 14px;
}

.gallery {
    width: 100%;
    max-width: 1400px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 260px));
    justify-content: center;
    gap: 25px;
}

.card {
    overflow: hidden;
    border-radius: 18px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    text-align: center;
    animation: appear .7s ease both;
}

.card img {
    display: block;
    width: 100%;
    height: 290px;
    object-fit: cover;
    object-position: center top;
    background: #30394d;
}

.card h2 {
    margin: 17px 8px 5px;
    font-size: 21px;
    color: #ffda83;
    text-transform: capitalize;
}

.card .message {
    margin: 8px 5px 20px;
    color: #e5e7eb;
    font-size: 15px;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 65px 15px;
    color: #cbd5e1;
}

.empty .icon {
    font-size: 65px;
    margin-bottom: 15px;
}

.empty h2 {
    color: #ffda83;
}

footer {
    padding: 35px 15px;
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 500px) {
    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 12px;
    }

    .card img {
        height: 210px;
    }

    .card h2 {
        font-size: 16px;
    }

    .card .message {
        font-size: 12px;
    }
}
</style>
</head>

<body>

const now = new Date();

const currentMonth = now.getMonth() + 1;
const currentDay = now.getDate();

const todayKey = `${currentMonth}/${currentDay}`;

document.getElementById("today").textContent =
    now.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    });


const celebrants = employees.filter(person => {

    const parts = person.birthday.split("/");
    const month = Number(parts[0]);
    const day = Number(parts[1]);

    return `${month}/${day}` === todayKey;

});


document.getElementById("count").textContent =
    `${celebrants.length} Celebrant${celebrants.length !== 1 ? "s" : ""} Today`;

const gallery = document.getElementById("gallery");


if (celebrants.length > 0) {

    celebrants.forEach((person, index) => {

        const name = person.image
            .replace(/\.[^/.]+$/, "")
            .replace(/[_-]/g, " ");

        const card = document.createElement("div");
        card.className = "card";
        card.style.animationDelay = `${index * 0.15}s`;

        const img = document.createElement("img");

        img.src = "images/" + person.image;
        img.alt = name;

        img.onerror = function() {
            this.style.display = "none";
        };

        const title = document.createElement("h2");

        const message = document.createElement("p");

        card.appendChild(img);
        card.appendChild(title);
        card.appendChild(message);

        gallery.appendChild(card);

    });

} else {

    gallery.innerHTML = `
        <div class="empty">
            <div class="icon">🎁</div>
